name: Release & Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build release binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-22.04
            artifact: bitcoin2maxd-linux-amd64
          - target: linux-arm64
            runner: ubuntu-22.04
            artifact: bitcoin2maxd-linux-arm64
            cross: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies (native)
        if: ${{ !matrix.cross }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake g++ libssl-dev libboost-system-dev

      - name: Install cross-compilation dependencies (arm64)
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libssl-dev:arm64 libboost-system-dev:arm64 || \
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF \
            -DENABLE_ELECTRUM=ON \
            ${{ matrix.cross && '-DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake' || '' }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/bitcoin2maxd dist/${{ matrix.artifact }}
          cp conf/bitcoin2max.conf dist/
          tar -czf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-22.04
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate SHA256 checksums
        run: |
          find artifacts/ -name '*.tar.gz' -exec sha256sum {} \; > SHA256SUMS
          cat SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag }}
          name: Bitcoin 2.0max ${{ github.ref_name || inputs.tag }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            SHA256SUMS
          body: |
            ## Bitcoin 2.0max ${{ github.ref_name || inputs.tag }}

            ### Installation

            1. Download the appropriate binary for your platform.
            2. Verify the checksum:
               ```bash
               sha256sum --check SHA256SUMS
               ```
            3. Copy the default config and start the node:
               ```bash
               mkdir -p ~/.bitcoin2max
               tar -xzf bitcoin2maxd-linux-amd64.tar.gz
               cp bitcoin2max.conf ~/.bitcoin2max/
               ./bitcoin2maxd
               ```

            See [README.md](README.md) for full documentation.

  publish-docker:
    name: Build & Push Docker image
    runs-on: ubuntu-22.04
    needs: build-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
