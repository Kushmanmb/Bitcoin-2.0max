name: Mark stale issues and PRs

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark stale
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            This issue has been inactive for 60 days.  It will be closed in
            14 days unless there is new activity.  Please comment if you
            are still working on this.
          stale-pr-message: >
            This pull request has been inactive for 60 days.  It will be
            closed in 14 days unless there is new activity.
          close-issue-message: >
            Closing due to inactivity.  Feel free to reopen if this is
            still relevant.
          close-pr-message: >
            Closing due to inactivity.  Feel free to reopen if work
            resumes.
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: 'pinned,security,roadmap'
          exempt-pr-labels: 'pinned,security'
