# Labeler configuration
# Maps labels to file glob patterns

"area: core":
  - changed-files:
      - any-glob-to-any-file:
          - src/node/**
          - include/bitcoin2max/**

"area: crypto":
  - changed-files:
      - any-glob-to-any-file:
          - src/crypto/**

"area: electrum":
  - changed-files:
      - any-glob-to-any-file:
          - src/electrum/**

"area: config":
  - changed-files:
      - any-glob-to-any-file:
          - src/config/**
          - conf/**

"area: build":
  - changed-files:
      - any-glob-to-any-file:
          - CMakeLists.txt
          - cmake/**
          - Dockerfile
          - "**/*.cmake"

"area: tests":
  - changed-files:
      - any-glob-to-any-file:
          - tests/**

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/**

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - docs/**
          - .github/ISSUE_TEMPLATE/**
          - .github/PULL_REQUEST_TEMPLATE.md

"area: packaging":
  - changed-files:
      - any-glob-to-any-file:
          - .github/workflows/release.yml
          - Dockerfile
