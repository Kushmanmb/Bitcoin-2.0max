# bitcoin2max.conf — Bitcoin 2.0max node configuration
# Copy to ~/.bitcoin2max/bitcoin2max.conf and adjust as needed.
# Lines starting with '#' or ';' are comments.

# ── Network ───────────────────────────────────────────────────────────────────

# P2P listening port
p2pport=8333

# JSON-RPC listening port
rpcport=8332

# RPC credentials (CHANGE THESE before exposing RPC externally)
rpcuser=bitcoin2maxrpc
rpcpassword=changeme

# ── Consensus (Bitcoin 2.0max supercharged parameters) ────────────────────────

# Target time between blocks in seconds (1 minute for supercharged speed)
targetblocktime=60

# Maximum block size in bytes (32 MiB for high scalability)
maxblocksize=33554432

# ── Electrum server ───────────────────────────────────────────────────────────
# The node connects to a local Electrum server instead of BOLDwallet,
# allowing fully independent wallet relay.

# Enable Electrum client (1=yes, 0=no)
electrum=1

# Electrum server hostname or IP
electrumhost=127.0.0.1

# Electrum server port
electrumport=9050

# Use TLS to connect to the Electrum server (0 for plain TCP on localhost)
electrumusessl=0

# ── Tor (optional) ────────────────────────────────────────────────────────────

# Route Electrum traffic through Tor (requires Tor running on torproxy)
tor=0
torproxy=127.0.0.1:9051

# ── Storage ───────────────────────────────────────────────────────────────────

# Directory to store blocks, chain state, and wallet data
datadir=~/.bitcoin2max

# ── Logging ───────────────────────────────────────────────────────────────────

# Log level: debug | info | warn | error
loglevel=info

# Log file path (leave blank to log to stderr)
#logfile=/var/log/bitcoin2max/bitcoin2max.log
